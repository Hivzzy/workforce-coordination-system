server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: kembang-tasik-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kembang_tasik_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.kembangtasik.backend: DEBUG
    org.hibernate.SQL: DEBUG
