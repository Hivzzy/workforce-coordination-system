server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: kembang-tasik-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:kembang_tasik_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.kembangtasik.backend: DEBUG
    org.hibernate.SQL: DEBUG
